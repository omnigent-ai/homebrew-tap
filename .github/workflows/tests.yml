name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      matrix:
        os: [ macos-15, macos-15-intel, macos-26 ]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Fail on ignored build failures
        # test-bot sets ignore_failures for any formula that is neither newly
        # added nor already bottled at its current version -- see
        # lib/tests/formulae.rb, `ignore_failures = !test_default_formula? &&
        # !bottled_on_current_version && !new_formula`.
        # That is every version-bump PR in this tap,
        # because the bottle block is only added later by `brew pr-pull`. So
        # `brew install --build-bottle` can fail while the step still exits 0
        # (`failed_steps.empty?` ignores them) and only prints
        # "Warning: N failed step ignored!". omnigent 0.7.0, 0.8.0 and 0.8.1 all
        # merged that way with three green checks and no bottle. test-bot records
        # the same summary in steps_output.txt, so gate the job on it.
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [ ! -f steps_output.txt ]; then
            echo "::error::steps_output.txt missing - brew test-bot did not run to completion."
            exit 1
          fi
          cat steps_output.txt
          if grep -qE "failed steps? ignored!" steps_output.txt; then
            echo "::error::brew test-bot ignored a failed step: the formula did not build. See the build log above."
            exit 1
          fi

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
