name: auto pr-pull

# Publish bottles and land a machine-generated formula bump without waiting for a
# human to apply the `pr-pull` label -- but only when the build demonstrably
# produced bottles AND the PR provably came from our own release automation.
#
# SECURITY: this is a `workflow_run` job, so it runs in the BASE repo context with
# `contents: write` even when the run it reacts to came from a fork PR. This repo
# is public and tests.yml runs on `pull_request`, so anyone can trigger the
# upstream run. A formula is executable Ruby plus arbitrary download URLs, and
# whatever this publishes becomes the bottle every `brew install omnigent` user
# receives -- so an unguarded version of this workflow is a supply-chain
# compromise waiting to happen. Note that `head_branch` on a fork PR is the
# ATTACKER's branch name, so a branch-name prefix is not a security control.
#
# Trust is therefore established before anything else runs:
#   * the run's head repository must be this repository (no fork PRs at all);
#   * the PR author must be the omnigent-ci App that opens these bumps;
#   * the tested commit must still be the PR head (a green run followed by a
#     force-push must not get published -- `brew pr-pull` resolves the PR's
#     CURRENT head, not the SHA that was tested);
#   * the diff must be exactly `Formula/omnigent.rb`.
# Anything else falls through to the existing manual `pr-pull` label, where a
# human reviews the diff first. That label path is unchanged.
#
# Why this runs `brew pr-pull` itself instead of adding the `pr-pull` label: a
# label applied with the default GITHUB_TOKEN does not start a new workflow run,
# so publish.yml would never fire.

on:
  workflow_run:
    workflows: ["brew test-bot"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: auto-pr-pull-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  auto-pr-pull:
    # First gate, evaluated before any step: same-repo runs only. This is what
    # keeps fork PRs out; the branch prefix below is convenience, not security.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'auto/formula/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
      # The App that omnigent's homebrew-tap-pr.yml opens these PRs as. `gh`
      # reports App actors as `app/<slug>`; the check below tolerates either form
      # so a gh upgrade cannot silently turn this into a permanent skip.
      EXPECTED_AUTHOR: omnigent-ci
    steps:
      - name: Resolve and authenticate the pull request
        id: pr
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
                  --json number,author,headRefOid,isCrossRepository --jq '.[0] // empty')"
          if [ -z "$pr" ]; then
            echo "No open PR for ${BRANCH} — already landed or closed; nothing to do." \
              | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          num="$(printf '%s' "$pr" | jq -r .number)"
          author="$(printf '%s' "$pr" | jq -r '.author.login')"
          head="$(printf '%s' "$pr" | jq -r .headRefOid)"
          cross="$(printf '%s' "$pr" | jq -r .isCrossRepository)"

          # Belt-and-braces against the fork case already blocked by the job `if`.
          if [ "$cross" != "false" ]; then
            echo "::error::PR #${num} is cross-repository — refusing to auto-publish."
            exit 1
          fi
          # Only our release App's bumps publish unattended.
          if [ "${author#app/}" != "$EXPECTED_AUTHOR" ]; then
            echo "::warning::PR #${num} is authored by '${author}', not '${EXPECTED_AUTHOR}' — leaving it for manual \`pr-pull\`."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # `brew pr-pull` resolves the PR's CURRENT head, so a green run followed
          # by a force-push would otherwise publish untested code.
          if [ "$head" != "$TESTED_SHA" ]; then
            echo "::error::PR #${num} head is ${head} but the green run tested ${TESTED_SHA} — refusing to publish untested code."
            exit 1
          fi
          # A formula is executable Ruby; only ever auto-publish a pure formula
          # bump so nothing else can ride along.
          files="$(gh pr view "$num" --repo "$GITHUB_REPOSITORY" --json files \
                     --jq '[.files[].path] | sort | join(",")')"
          if [ "$files" != "Formula/omnigent.rb" ]; then
            echo "::warning::PR #${num} touches ${files}, not just Formula/omnigent.rb — leaving it for manual \`pr-pull\`."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=${num}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "PR #${num} by ${author}, head ${head} == tested SHA, formula-only diff." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Require that bottles were actually built
        if: steps.pr.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # `upload-artifact` has if-no-files-found: warn, so a build that produced
          # no bottle uploads no artifact at all. Artifact presence is therefore the
          # signal that the formula really built.
          names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
                     --jq '[.artifacts[] | select(.name | startswith("bottles_")) | select(.size_in_bytes > 1024) | .name] | sort | join(" ")')"
          if [ -z "$names" ]; then
            echo "::error::test-bot run ${RUN_ID} produced no bottle artifacts — the formula did not build. Not publishing."
            exit 1
          fi
          echo "Bottles present: ${names}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Reject a build whose failure test-bot swallowed
        if: steps.pr.outputs.skip != 'true'
        run: |
          set -euo pipefail
          # `brew test-bot` sets ignore_failures for any formula that is neither
          # newly added nor already bottled at its current version
          # (lib/tests/formulae.rb) -- which is every version bump in this tap,
          # since the bottle block is only added afterwards. A failed
          # `brew install --build-bottle` then still exits 0 and only prints
          # "Warning: N failed step ignored!". omnigent 0.7.0, 0.8.0 and 0.8.1 all
          # reported green that way. Refuse to auto-publish such a run.
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" --paginate --jq '.jobs[].id')"
          bad=0
          for id in $ids; do
            name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${id}" --jq .name)"
            log="$(gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${id}/logs" 2>/dev/null || true)"
            if printf '%s' "$log" | grep -qE "failed steps? ignored!"; then
              echo "::error::${name}: brew test-bot ignored a failed step — the formula did not build."
              bad=1
            fi
          done
          [ "$bad" -eq 0 ] || exit 1
          echo "No ignored build failures." | tee -a "$GITHUB_STEP_SUMMARY"

      # Third-party actions are SHA-pinned: this job holds `contents: write` and
      # publishes what users install, so a moving `@main` tag is a supply-chain
      # vector. Same pin omnigent-ai/omnigent uses.
      - name: Set up Homebrew
        if: steps.pr.outputs.skip != 'true'
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026-07-10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        if: steps.pr.outputs.skip != 'true'
        uses: Homebrew/actions/git-user-config@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026-07-10

      - name: Pull bottles
        if: steps.pr.outputs.skip != 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST: ${{ steps.pr.outputs.number }}
        run: brew pr-pull --debug --tap="$GITHUB_REPOSITORY" "$PULL_REQUEST"

      - name: Push commits
        if: steps.pr.outputs.skip != 'true'
        uses: Homebrew/actions/git-try-push@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026-07-10
        with:
          branch: main

      - name: Delete branch
        if: steps.pr.outputs.skip != 'true'
        run: git push --delete origin "$BRANCH"

      - name: Summary
        if: steps.pr.outputs.skip != 'true'
        env:
          PULL_REQUEST: ${{ steps.pr.outputs.number }}
        run: |
          echo "Auto-published bottles for #${PULL_REQUEST} (${BRANCH}) and pushed to main." \
            >> "$GITHUB_STEP_SUMMARY"
